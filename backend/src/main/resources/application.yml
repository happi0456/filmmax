spring:
  application:
    name: film-max
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/filmmax?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:filmmax}
    password: ${SPRING_DATASOURCE_PASSWORD:filmmax}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars}
    expiration-ms: 3600000

server:
  port: 8080
  error:
    include-message: always